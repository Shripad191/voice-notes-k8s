<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Notes</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #e2e5e8, #e2e5e8);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }
        .main-container-gradient {
            background: linear-gradient(135deg, #e0f2fe, #bfdbfe);
        }
        .mic-icon {
            transition: transform 0.2s ease-in-out;
        }
        .mic-active {
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.1);
            }
        }
        .btn-gradient {
            background-image: linear-gradient(to right, var(--tw-gradient-stops));
        }
    </style>
</head>
<body>
    <div class="max-w-3xl w-full main-container-gradient rounded-3xl shadow-xl p-6 sm:p-10 flex flex-col items-center">
        <!-- Title and description -->
        <h1 class="text-4xl sm:text-5xl font-extrabold text-gray-800 mb-2 drop-shadow-sm">Voice Notes App</h1>
        <p class="text-gray-500 text-lg text-center mb-8">
            Start talking and watch your words appear.
        </p>

        <!-- Main text area for notes -->
        <textarea id="notes-area"
                  class="w-full h-80 p-6 border-2 border-gray-200 rounded-2xl focus:outline-none focus:ring-4 focus:ring-blue-300 focus:border-transparent transition-all duration-300 text-gray-700 resize-none leading-relaxed text-base shadow-inner"></textarea>

        <!-- Control buttons and status -->
        <div class="mt-8 flex flex-col sm:flex-row items-center justify-center space-y-4 sm:space-y-0 sm:space-x-4 w-full">
            <button id="start-btn"
                    class="w-full sm:w-auto px-8 py-4 text-white font-bold rounded-full shadow-md transition-transform duration-200 transform hover:scale-105 active:scale-95 flex items-center justify-center space-x-2 btn-gradient from-blue-500 to-blue-700 hover:from-blue-600 hover:to-blue-800">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mic-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a7 7 0 01-7-7m7 7a7 7 0 007-7m0 0H5m14 0h3m-3 0V5m0 0V2m0 10V2"/>
                </svg>
                <span>Start Dictation</span>
            </button>
            <button id="stop-btn"
                    class="w-full sm:w-auto px-8 py-4 bg-gray-200 text-gray-600 font-bold rounded-full shadow-md hover:bg-gray-300 transition-transform duration-200 transform hover:scale-105 active:scale-95 flex items-center justify-center space-x-2"
                    disabled>
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                  <path stroke-linecap="round" stroke-linejoin="round" d="M9 10h6M9 14h6M9 18h6" />
                </svg>
                <span>Stop</span>
            </button>
            <button id="download-btn"
                    class="w-full sm:w-auto px-8 py-4 text-white font-bold rounded-full shadow-md transition-transform duration-200 transform hover:scale-105 active:scale-95 flex items-center justify-center space-x-2 btn-gradient from-emerald-500 to-green-600 hover:from-emerald-600 hover:to-green-700">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                </svg>
                <span>Download</span>
            </button>
            <button id="clear-btn"
                    class="w-full sm:w-auto px-8 py-4 text-white font-bold rounded-full shadow-md transition-transform duration-200 transform hover:scale-105 active:scale-95 flex items-center justify-center space-x-2 btn-gradient from-rose-500 to-red-600 hover:from-rose-600 hover:to-red-700">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                </svg>
                <span>Clear</span>
            </button>
        </div>

        <div id="status" class="mt-6 text-center text-gray-500 font-semibold transition-opacity duration-300"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const notesArea = document.getElementById('notes-area');
            const startBtn = document.getElementById('start-btn');
            const stopBtn = document.getElementById('stop-btn');
            const downloadBtn = document.getElementById('download-btn');
            const clearBtn = document.getElementById('clear-btn');
            const statusDiv = document.getElementById('status');
            const micIcon = startBtn.querySelector('.mic-icon');

            // Check for Web Speech API browser support
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

            if (!SpeechRecognition) {
                statusDiv.textContent = 'Speech Recognition API is not supported in this browser. Please use Chrome or a similar browser.';
                startBtn.disabled = true;
                stopBtn.disabled = true;
                downloadBtn.disabled = true;
                clearBtn.disabled = true;
                return;
            }

            const recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = 'en-US';

            let finalTranscript = '';
            let isListening = false;

            // Handle recognition results
            recognition.onresult = (event) => {
                let interimTranscript = '';
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    const transcript = event.results[i][0].transcript;
                    if (event.results[i].isFinal) {
                        finalTranscript += transcript + ' ';
                    } else {
                        interimTranscript += transcript;
                    }
                }
                notesArea.value = finalTranscript + interimTranscript;
            };

            // Handle recognition errors
            recognition.onerror = (event) => {
                console.error('Speech recognition error:', event.error);
                statusDiv.textContent = 'Error: ' + event.error;
                // Clean up state
                isListening = false;
                startBtn.disabled = false;
                stopBtn.disabled = true;
                micIcon.classList.remove('mic-active');
            };

            // Handle when recognition stops
            recognition.onend = () => {
                if (isListening) {
                    // If we intended to keep listening, restart it
                    try {
                        recognition.start();
                    } catch (e) {
                        console.error('Recognition restart failed:', e);
                        statusDiv.textContent = 'Microphone access lost. Please click Start again.';
                        isListening = false;
                        startBtn.disabled = false;
                        stopBtn.disabled = true;
                        micIcon.classList.remove('mic-active');
                    }
                } else {
                    statusDiv.textContent = 'Dictation stopped.';
                    startBtn.disabled = false;
                    stopBtn.disabled = true;
                    micIcon.classList.remove('mic-active');
                }
            };

            // Start button click handler
            startBtn.addEventListener('click', () => {
                try {
                    notesArea.focus();
                    finalTranscript = notesArea.value;
                    recognition.start();
                    isListening = true;
                    statusDiv.textContent = 'Listening...';
                    startBtn.disabled = false;
                    stopBtn.disabled = false;
                    micIcon.classList.add('mic-active');
                } catch (e) {
                    console.error('Could not start recognition:', e);
                    statusDiv.textContent = 'Could not start. Please check microphone permissions.';
                    isListening = false;
                    startBtn.disabled = false;
                    stopBtn.disabled = true;
                }
            });

            // Stop button click handler
            stopBtn.addEventListener('click', () => {
                recognition.stop();
                isListening = false;
                statusDiv.textContent = 'Dictation stopped.';
                startBtn.disabled = false;
                stopBtn.disabled = true;
                micIcon.classList.remove('mic-active');
            });

            // Download button click handler
            downloadBtn.addEventListener('click', () => {
                const text = notesArea.value;
                if (!text.trim()) {
                    statusDiv.textContent = 'Notes area is empty. Nothing to download.';
                    return;
                }
                const blob = new Blob([text], { type: 'text/plain' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = 'voice_notes.txt';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(a.href);
                statusDiv.textContent = 'File downloaded successfully!';
            });

            // Clear button click handler
            clearBtn.addEventListener('click', () => {
                notesArea.value = '';
                finalTranscript = '';
                statusDiv.textContent = 'Notes cleared.';
            });
        });
    </script>
</body>
</html>
