apiVersion: apps/v1
kind: Deployment
metadata:
  name: voice-notes
spec:
  replicas: 2
  selector:
    matchLabels:
      app: voice-notes
  template:
    metadata:
      labels:
        app: voice-notes
    spec:
      containers:
        - name: web
          image: voice-notes:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
          resources:
            requests: 
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 64Mi
---

apiVersion: v1
kind: Service
metadata:
  name: voice-notes
spec:
  type: NodePort
  selector:
    app: voice-notes
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30090